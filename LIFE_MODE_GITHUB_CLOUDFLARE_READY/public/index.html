const $=s=>document.querySelector(s),t=(k)=>dict[state.lang]?.[k]??dict.ru[k],esc=(x)=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const save=()=>{try{localStorage.setItem(K,JSON.stringify(state))}catch{}},flash=(msg)=>{let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)},go=(tab)=>{state.tab=tab;save();render();window.scrollTo({top:0,behavior:'smooth'})};
const avatarSvg=()=>`<svg class="avatar" viewBox="0 0 100 130" role="img" aria-label="Original illustrated avatar"><defs><linearGradient id="jacket" x2="1" y2="1"><stop stop-color="#9bcfff"/><stop offset="1" stop-color="#987af3"/></linearGradient></defs><ellipse cx="49" cy="125" rx="31" ry="4" fill="#0a1121"/><path d="M27 73Q50 63 73 73L85 123H15Z" fill="url(#jacket)"/><path d="M41 62V77Q49 89 58 77V61" fill="#d79d79"/><ellipse cx="49" cy="42" rx="26" ry="30" fill="#efb18d"/><path d="M23 44Q18 7 46 12Q69 4 76 34L72 46Q69 33 58 26Q43 43 23 44Z" fill="#273e5c"/><circle cx="40" cy="48" r="2.1" fill="#293143"/><circle cx="59" cy="48" r="2.1" fill="#293143"/><path d="M43 60Q50 64 56 60" stroke="#a76f62" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M22 112V130M77 112V130" stroke="#6f92ce" stroke-width="11"/></svg>`;
function houseSvg(){const rooms=[{name:t('room1'),a:0,color:'#426d88',x:282,y:60,lab:'☾',quest:'rest'},{name:t('room2'),a:1,color:'#706098',x:407,y:139,lab:'♡',quest:'talk'},{name:t('room3'),a:2,color:'#447e74',x:157,y:139,lab:'✦',quest:'build'},{name:t('room4'),a:3,color:'#8a6757',x:282,y:218,lab:'⌂',quest:'plan'}];return `<svg class="rooms" viewBox="0 0 580 410" role="group" aria-label="Interactive life-house map"><defs><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter></defs><ellipse cx="290" cy="305" rx="255" ry="90" fill="#0a1425" opacity=".5"/>${rooms.map((r,i)=>`<g class="tile" data-room="${i}" tabindex="0" role="button" aria-label="${esc(r.name)}" filter="url(#shadow)"><path d="M${r.x} ${r.y+120}l125 79v14l-125 -79l-125 79v-14z" fill="#1d263a"/><path class="base" d="M${r.x} ${r.y}l125 79l-125 79l-125 -79Z" fill="${r.color}" stroke="#a1afcb" stroke-opacity=".6" stroke-width="2"/><path d="M${r.x} ${r.y}l0 -38l125 79v38z" fill="#26334b" opacity=".88"/><path d="M${r.x} ${r.y}l-125 79v-38l125 -79z" fill="#344965" opacity=".8"/><path d="M${r.x} ${r.y+39}l62 40l-62 40l-62 -40Z" fill="#d9e7f3" opacity=".09"/><circle cx="${r.x}" cy="${r.y+68}" r="25" fill="#172238" opacity=".83"/><text x="${r.x}" y="${r.y+77}" text-anchor="middle" fill="#e8f6ff" font-size="31">${r.lab}</text><text x="${r.x}" y="${r.y+105}" text-anchor="middle" fill="white" font-weight="750" font-size="15">${esc(r.name)}</text>${state.done.some(d=>Number(d.split(':')[0])===({0:2,1:0,2:1,3:0}[i]))?`<circle cx="${r.x+40}" cy="${r.y+52}" r="11" fill="#79d6b5"/><text x="${r.x+40}" y="${r.y+57}" text-anchor="middle" fill="#0a241a" font-size="13">✓</text>`:''}</g>`).join('')}</svg>`}
function radarSvg(){let n=8,cx=200,cy=175,r=120,axes=Array.from({length:n},(_,i)=>{let a=i*2*Math.PI/n-Math.PI/2;return {x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,lx:cx+Math.cos(a)*153,ly:cy+Math.sin(a)*153}});let rings=[30,60,90,120].map(rr=>`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="none" stroke="#a6b2c7" stroke-opacity=".19"/>`).join('');let polygon=state.ratings.map((v,i)=>{let a=i*2*Math.PI/n-Math.PI/2;return `${cx+Math.cos(a)*r*v/10},${cy+Math.sin(a)*r*v/10}`}).join(' ');return `<svg class="radar" viewBox="0 0 400 355" aria-label="Personal self-assessment radar chart">${rings}${axes.map(a=>`<line x1="${cx}" y1="${cy}" x2="${a.x}" y2="${a.y}" stroke="#93a8bb" stroke-opacity=".25"/>`).join('')}<polygon points="${polygon}" fill="#71dcc1" fill-opacity=".21" stroke="#83e9d1" stroke-width="2.6"/>${state.ratings.map((v,i)=>{let a=i*2*Math.PI/n-Math.PI/2;return `<circle cx="${cx+Math.cos(a)*r*v/10}" cy="${cy+Math.sin(a)*r*v/10}" r="${state.area===i?6:3.5}" fill="${state.area===i?'#ffbc90':'#a6f5d9'}"/>`}).join('')}${axes.map((a,i)=>`<text x="${a.lx}" y="${a.ly+4}" fill="${i===state.area?'#adfbd7':'#aabbd0'}" font-size="${state.lang==='en'?11:10.5}" text-anchor="middle">${esc(t('rooms')[i])}</text>`).join('')}</svg>`}
const button=(title,fn,cls='')=>`<button class="btn ${cls}" data-action="${fn}">${esc(title)}</button>`;
function intro(){return `<div class="intro card"><div class="eyebrow">LIFE MODE / FIRST PLAYABLE</div><h1>${t('intro')}</h1><p>${t('welcome')}</p><div class="onboard-preview"><span>◈ Life Map</span><span>⌂ World</span><span>↗ Real quests</span><span>✦ Future Self</span></div><label class="field" for="name">${t('name')}</label><input id="name" type="text" maxlength="32" placeholder="${esc(t('namePlaceholder'))}" value="${esc(state.name)}"/><label class="age"><input type="checkbox" id="age"/> ${t('age')}</label>${button(t('start'),'start','primary')}<p class="small" style="margin-top:16px">${t('noData')}</p></div>`}
function nav(){return `<div class="hero"><div><div class="eyebrow">YOUR LIFE / YOUR WAY</div><h1>${t('hello')}</h1><p>${t('subtitle')}</p></div><div class="progressline"><div class="xp-row"><strong>${t('level')} ${Math.floor(state.xp/100)+1}</strong><span>${state.xp} XP</span></div><div class="meter"><i style="width:${state.xp%100}%"></i></div></div></div><nav class="tabs">${['world','map','practice','future','feedback'].map(x=>`<button class="tab ${x===state.tab?'active':''}" data-tab="${x}">${esc(t(x))}</button>`).join('')}</nav>`}
function side(){return `<aside class="side"><div class="card"><div class="avatar-panel">${avatarSvg()}<div><h3>${esc(state.name||'My Avatar')}</h3><p class="small">${t('status')}</p><span class="pill">${t('level')} ${Math.floor(state.xp/100)+1}</span></div></div><div class="statline"><span>${t('skills')}</span><span class="value">${state.done.length}/9</span></div><div class="statline"><span>${t('xp')}</span><span class="value">${state.xp}</span></div></div><div class="card"><h3>${t('map')}</h3><p class="small">${t('nudge')}</p>${button(t('goMap'),'map','secondary')}</div><div class="test-info">MVP 0.1 — ${t('noData')}</div></aside>`}
function world(){return `<h2 class="section-title">${t('houseTitle')}</h2><p class="section-sub">${t('houseSub')}</p>${houseSvg()}<div class="room-note">${t('houseNote')}</div><div class="actions">${button(t('goPractice'),'practice','primary')}${button(t('goMap'),'map','secondary')}</div>`}
function map(){return `<h2 class="section-title">${t('myMap')}</h2><p class="section-sub">${t('mapSub')}</p>${radarSvg()}<div class="area-buttons">${t('rooms').map((a,i)=>`<button class="area-btn ${state.area===i?'chosen':''}" data-area="${i}">${esc(a)}</button>`).join('')}</div><div class="area-value"><div><strong style="font-size:16px;color:var(--text)">${esc(t('rooms')[state.area])}</strong><p class="small">${esc(t('desc')[state.area])}</p></div><strong>${state.ratings[state.area]}/10</strong></div><div class="small">${t('areaHint')}</div><input aria-label="Self-assessment value" type="range" id="rating" min="0" max="10" step="1" value="${state.ratings[state.area]}"/><div class="muted-box" style="margin-top:20px">${t('mapNote')}</div>`}
function practice(){let s=t('scenarios')[state.scenario],id=state.scenario+':'+state.choice;return `<h2 class="section-title">${t('practiceTitle')}</h2><p class="section-sub">${t('practiceSub')}</p><div class="scenario-select">${t('scenarios').map((x,i)=>`<button class="btn ${state.scenario===i?'primary':'secondary'}" data-scenario="${i}">${esc(x.name)}</button>`).join('')}</div><div class="muted-box" style="color:var(--text);font-size:15px">${esc(s.short)}</div><h3 style="font-size:15px;margin-top:22px">${t('choose')}</h3>${s.options.map((x,i)=>`<button class="choice ${state.choice===i?'active':''}" data-choice="${i}">${i+1}. ${esc(x)}</button>`).join('')}${state.choice===null?`<p class="small">${t('reflect')}</p>`:`<div class="outcome"><strong>${t('outcome')}</strong><p>${esc(s.outcomes[state.choice])}</p></div><div class="quest"><strong>✦ ${t('task')}</strong><p style="color:var(--text)">${esc(s.quests[state.choice])}</p>${button(state.done.includes(id)?t('completed'):t('complete'),'complete','primary '+(state.done.includes(id)?'done':''))}</div>`}`}
function future(){return `<h2 class="section-title">${t('futureTitle')}</h2><p class="section-sub">${t('futureSub')}</p><label class="field" for="future-text">${t('futureLabel')}</label><textarea id="future-text" maxlength="700" placeholder="${esc(t('futurePH'))}">${esc(state.future)}</textarea><div class="quest"><strong>${t('futurePrompt')}</strong><p style="color:var(--text)">“${t('futureAff')}”</p></div>${button(t('futureSave'),'futureSave','primary')}`}
function feedback(){return `<h2 class="section-title">${t('feedbackTitle')}</h2><p class="section-sub">${t('feedbackSub')}</p>${['simple','interesting','return'].map((key,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${i+1}. ${t(['surveySimple','surveyFun','surveyReturn'][i])}</strong><p class="small">${t('scale')}</p><div class="ticks">${[1,2,3,4,5].map(n=>`<button class="scale ${state.survey[key]===n?'selected':''}" data-scale="${key}:${n}">${n}</button>`).join('')}</div></div>`).join('')}<label class="field" for="comment">${t('surveyComment')}</label><textarea id="comment" maxlength="1600" placeholder="${esc(t('surveyPH'))}">${esc(state.survey.comment)}</textarea><div class="actions">${button(t('copy'),'copy','primary')}${button(t('export'),'export','secondary')}${button(t('reset'),'reset','secondary')}</div><p class="small">${t('noData')}</p>`}
function surveyFix(){return null}
function render(){document.documentElement.lang=state.lang;$('#language').value=state.lang;$('#privacyTag').textContent=t('priv');$('#footer').textContent=t('footer');$('#root').innerHTML=!state.started?intro():nav()+`<div class="main"><main class="card" id="main">${({world,map,practice,future,feedback}[state.tab]||world)()}</main>${side()}</div>`;bind()}
function feedbackPacket(){return {product:'LIFE MODE MVP 0.1',language:state.lang,survey:{...state.survey},questsCompleted:state.done.length,ratings:state.ratings,goal:state.future||undefined,generatedAt:new Date().toISOString(),notes:'Participant chose to export these data; do not treat as clinical measurements.'}}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.addEventListener('click',()=>go(e.dataset.tab)));document.querySelectorAll('[data-area]').forEach(e=>e.addEventListener('click',()=>{state.area=Number(e.dataset.area);save();render()}));document.querySelectorAll('[data-scenario]').forEach(e=>e.addEventListener('click',()=>{state.scenario=Number(e.dataset.scenario);state.choice=null;save();render()}));document.querySelectorAll('[data-choice]').forEach(e=>e.addEventListener('click',()=>{state.choice=Number(e.dataset.choice);save();render()}));document.querySelectorAll('[data-room]').forEach(e=>{let fn=()=>{let i=Number(e.dataset.room);state.area=[0,2,3,4][i];go('map')};e.addEventListener('click',fn);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fn()}})});document.querySelectorAll('[data-scale]').forEach(e=>e.addEventListener('click',()=>{let [key,val]=e.dataset.scale.split(':');state.survey[key]=Number(val);save();render()}));let slider=$('#rating');if(slider)slider.addEventListener('change',()=>{state.ratings[state.area]=Number(slider.value);save();render()});let comment=$('#comment');if(comment)comment.addEventListener('input',()=>{state.survey.comment=comment.value;save()});let goal=$('#future-text');if(goal)goal.addEventListener('input',()=>{state.future=goal.value;save()});document.querySelectorAll('[data-action]').forEach(e=>e.addEventListener('click',async()=>{let a=e.dataset.action;if(['world','map','practice','future','feedback'].includes(a)){go(a);return}if(a==='start'){if(!$('#age').checked){$('#age').focus();return}state.started=true;state.name=($('#name')?.value||'').trim().slice(0,32);save();render()}else if(a==='complete'){let id=state.scenario+':'+state.choice;if(!state.done.includes(id)){state.done.push(id);state.xp+=30;state.ratings[t('scenarios')[state.scenario].area]=Math.min(10,state.ratings[t('scenarios')[state.scenario].area]+1);save();render();flash('+30 XP ✦')}}else if(a==='futureSave'){state.future=$('#future-text')?.value||'';save();flash(t('saved'))}else if(a==='reset'){if(confirm(t('resetConfirm'))){localStorage.removeItem(K);state={...defaults,lang:state.lang};render()}}else if(a==='export'){let blob=new Blob([JSON.stringify(feedbackPacket(),null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='life-mode-test-feedback.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),500)}else if(a==='copy'){let text=JSON.stringify(feedbackPacket(),null,2);try{await navigator.clipboard.writeText(text);flash(t('copyOK'))}catch{let el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');flash(t('copyOK'))}catch{flash(t('copyFail'))}el.remove()}}}))}
$('#language').addEventListener('change',e=>{state.lang=e.target.value;save();render()});render();
</script>
